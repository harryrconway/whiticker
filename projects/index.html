<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Projects — Whiticker</title>
	<meta name="description" content="Selected commissions — Whiticker. Architecture, lifestyle &amp; people, travel &amp; hotels.">

	<!-- Flip no-js → js before first paint, so the hidden-until-revealed
	     states only apply when JS is actually there to reveal them -->
	<script>document.documentElement.className = 'js';</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap">

	<!-- Shared with the homepage: a visitor arriving from there has both
	     cached, so this page costs one request -->
	<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="site-header">
	<a class="brand" href="../" aria-label="Whiticker — home">Whiticker</a>

	<button
		class="nav-toggle"
		type="button"
		aria-label="Open menu"
		aria-expanded="false"
		aria-controls="site-nav">
		<span class="nav-toggle__box">
			<i class="nav-toggle__bar"></i>
			<i class="nav-toggle__bar"></i>
		</span>
	</button>
</header>

<nav id="site-nav" class="nav-overlay" aria-hidden="true">
	<div class="nav-overlay__inner">
		<!-- Links resolve to the homepage from this depth -->
		<ul class="nav-list">
			<li style="--i:0"><a href="../#behind-the-lens">About</a></li>
			<li style="--i:1"><a href="#top">Projects</a></li>
			<li style="--i:2"><a href="../#contact">Contact</a></li>
		</ul>

		<a
			class="nav-ig"
			href="https://www.instagram.com/"
			target="_blank"
			rel="noopener noreferrer"
			aria-label="Instagram">
			<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
				<rect x="2.5" y="2.5" width="19" height="19" rx="5.25"
					fill="none" stroke="currentColor" stroke-width="1.3"/>
				<circle cx="12" cy="12" r="4.6"
					fill="none" stroke="currentColor" stroke-width="1.3"/>
				<circle cx="17.6" cy="6.4" r="1.15" fill="currentColor"/>
			</svg>
		</a>
	</div>
</nav>
